$_is_mobile = preg_match('/(android|iphone|ipad|ipod|mobile|blackberry|iemobile|opera mini|windows phone)/i', $_SERVER['HTTP_USER_AGENT'] ?? '');

                <div id="xnxPandownCodeBox" class="xnx-pandown-code-box">
                    <div class="small text-body-secondary mb-1"><?php echo lang('xnx_pandown_code_label');?></div>
                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <span id="xnxPandownCodeValue" class="xnx-pandown-code-value"></span>

                <?php if ($_is_mobile): ?>
                <div id="xnxPandownQrUrlDisplay" class="mt-2 p-2 bg-body-tertiary rounded text-break small text-body-secondary"></div>
                <p class="mt-3">
                    <a id="xnxPandownQrLink" href="#" target="_blank" rel="noopener" class="btn btn-primary"><?php echo lang('xnx_pandown_open_link');?></a>
                    <button type="button" class="btn btn-outline-secondary" id="xnxPandownCopyBtn"><?php echo lang('xnx_pandown_copy_link');?></button>
                </p>
                <?php endif; ?>
                <p class="text-muted small mt-3 mb-0"><?php echo lang('xnx_pandown_qr_tip');?></p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('click', function(e) {
    var btn = e.target.closest('.xnx-pandown-btn');
    if (!btn) return;
    var url = btn.getAttribute('data-url');
    var qr = btn.getAttribute('data-qr');
    var code = btn.getAttribute('data-code') || '';
    if (!url) return;
    var qrImg = document.getElementById('xnxPandownQrImage');
    if (qrImg) qrImg.setAttribute('src', qr);
    var qrLink = document.getElementById('xnxPandownQrLink');
    if (qrLink) qrLink.setAttribute('href', url);
    var codeBox = document.getElementById('xnxPandownCodeBox');
    var codeValue = document.getElementById('xnxPandownCodeValue');
    if (codeBox && codeValue) {
        if (code !== '') {
            codeValue.textContent = code;
            codeBox.classList.add('is-visible');
        } else {
            codeBox.classList.remove('is-visible');
        }
    }
    <?php if ($_is_mobile): ?>
    var urlDisplay = document.getElementById('xnxPandownQrUrlDisplay');
    if (urlDisplay) urlDisplay.textContent = url;
    <?php endif; ?>
    var modalEl = document.getElementById('xnxPandownQrModal');
    if (modalEl) {
        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
    }
});

<?php if ($_is_mobile): ?>
var copyBtn = document.getElementById('xnxPandownCopyBtn');
if (copyBtn) {
    copyBtn.addEventListener('click', function() {
        var link = document.getElementById('xnxPandownQrLink');
        if (!link) return;
        var url = link.getAttribute('href');
        if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(function() {
                if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_link_copied'));?>', 'success');
            });
        } else {
            var temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = url;
            temp.select();
            document.execCommand('copy');
            temp.remove();
            if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_link_copied'));?>', 'success');
        }
    });
}
<?php endif; ?>

var copyCodeBtn = document.getElementById('xnxPandownCopyCode');
if (copyCodeBtn) {
    copyCodeBtn.addEventListener('click', function() {
        var val = document.getElementById('xnxPandownCodeValue');
        if (!val) return;
        var code = val.textContent;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(code).then(function() {
                if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_code_copied'));?>', 'success');
            });
        } else {
            var temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = code;
            temp.select();
            document.execCommand('copy');
            temp.remove();
            if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_code_copied'));?>', 'success');
        }
    });
}
</script>
<?php endif; ?>
