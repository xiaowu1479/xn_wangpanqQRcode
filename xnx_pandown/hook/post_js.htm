<script>
function xnxPandownExtractUrl(text) {
    var m = text.match(/https?:\/\/[^\s<>"']+/);
    if (m) return m[0];
    var patterns = [
        /pan\.baidu\.com\/s\/[a-zA-Z0-9\-]+/i,
        /yun\.baidu\.com\/s\/[a-zA-Z0-9\-]+/i,
        /pan\.quark\.cn\/s\/[a-zA-Z0-9]+/i,
        /kuake\.com\/s\/[a-zA-Z0-9]+/i,
        /drive\.uc\.cn\/s\/[a-zA-Z0-9]+/i,
        /uc\.cn\/s\/[a-zA-Z0-9]+/i,
        /pan\.xunlei\.cn\/s\/[a-zA-Z0-9]+/i,
        /xunlei\.com\/s\/[a-zA-Z0-9]+/i,
        /aliyundrive\.com\/s\/[a-zA-Z0-9]+/i,
        /aliyundrive\.net\/s\/[a-zA-Z0-9]+/i,
        /guangyapan\.com\/s\/[a-zA-Z0-9_]+/i,
    ];
    for (var i = 0; i < patterns.length; i++) {
        m = text.match(patterns[i]);
        if (m) {
            var url = m[0];
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            return url;
        }
    }
    return text.trim();
}

function xnxPandownExtractCode(text) {
    var patterns = [
        /[提密][取码]\s*[:：]\s*([A-Za-z0-9]+)/,
        /code\s*[:：]\s*([A-Za-z0-9]+)/i,
        /提取码[:：]\s*([A-Za-z0-9]+)/,
        /密码[:：]\s*([A-Za-z0-9]+)/,
    ];
    for (var i = 0; i < patterns.length; i++) {
        var m = text.match(patterns[i]);
        if (m) return m[1];
    }
    return '';
}

(function(){
    function xnxPandownAddToolbarBtn(){
        var container = document.querySelector('.aie-container');
        if (!container) { setTimeout(xnxPandownAddToolbarBtn, 500); return; }
        if (container.querySelector('.xnxPandownToolbarBtn')) return;
        var aiBtn = container.querySelector('aie-ai');
        if (!aiBtn) { setTimeout(xnxPandownAddToolbarBtn, 500); return; }
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'xnxPandownToolbarBtn';
        btn.innerHTML = '<img src="plugin/xnx_pandown/icon.png" style="width:16px;height:16px;vertical-align:middle" alt="">';
        btn.title = '<?php echo addslashes(lang('xnx_pandown_btn_tip'));?>';
        btn.onclick = function(e) {
            e.preventDefault();
            var modalEl = document.getElementById('xnxPandownModal');
            if (modalEl) {
                var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                modal.show();
            }
        };
        aiBtn.parentNode.insertBefore(btn, aiBtn.nextSibling);
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', xnxPandownAddToolbarBtn);
    } else {
        xnxPandownAddToolbarBtn();
    }
})();

document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('xnxPandownInput');
    var preview = document.getElementById('xnxPandownPreview');
    var previewUrl = document.getElementById('xnxPandownUrlPreview');
    var codeInput = document.getElementById('xnxPandownCode');
    var submitBtn = document.getElementById('xnxPandownSubmit');
    if (!input || !submitBtn) return;

    input.addEventListener('input', function() {
        var text = input.value.trim();
        if (!text) { preview.style.display = 'none'; return; }
        var url = xnxPandownExtractUrl(text);
        if (url && url !== text) {
            previewUrl.textContent = url;
            preview.style.display = '';
            var code = xnxPandownExtractCode(text);
            if (code && codeInput && !codeInput.value) codeInput.value = code;
        } else {
            preview.style.display = 'none';
        }
    });

    submitBtn.addEventListener('click', function() {
        var text = input.value.trim();
        if (!text) {
            if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_url_empty'));?>', 'warning');
            return;
        }
        var url = xnxPandownExtractUrl(text);
        if (!url) {
            if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_url_invalid'));?>', 'warning');
            return;
        }
        var code = codeInput ? codeInput.value.trim() : '';
        var tag = '[pd url="' + url.replace(/"/g, '&quot;') + '"';
        if (code !== '') tag += ' code="' + code.replace(/"/g, '&quot;') + '"';
        tag += ']';
        var editor = window.aiEditorInstance;
        if (editor && typeof editor.insert === 'function') {
            editor.focus();
            editor.insert(tag);
            var hiddenInput = document.querySelector('input[name="message"]');
            if (hiddenInput && typeof editor.getHtml === 'function') {
                hiddenInput.value = editor.getHtml();
            }
        }
        input.value = '';
        if (codeInput) codeInput.value = '';
        preview.style.display = 'none';
        var modalEl = document.getElementById('xnxPandownModal');
        if (modalEl) {
            var modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
        }
        if (typeof XN !== 'undefined' && XN.toast) XN.toast('<?php echo addslashes(lang('xnx_pandown_inserted'));?>', 'success');
    });
});
</script>
